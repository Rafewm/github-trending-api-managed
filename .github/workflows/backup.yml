name: Back up stars and lists

# A daily copy of Rafewm's GitHub stars and the Unstarred site's Hidden and Track lists, in data/backup/.
# Git history keeps every day's version, so any day can be restored.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: github-trending-publisher
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Save the lists
        run: node script/backup.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs even if one list failed, so the others are still saved; the job still shows the failure.
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backup
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "backup: stars, hidden and tracked lists $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
