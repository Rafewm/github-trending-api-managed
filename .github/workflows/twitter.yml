name: Collect Twitter (twscrape)

on:
  workflow_dispatch:
  schedule:
    # Hourly, offset from the trending run. Each run does TW_BATCH accounts (oldest first),
    # so all ~47 are covered in a few hours and then kept fresh.
    - cron: '17 * * * *'

concurrency:
  group: twitter-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install twscrape
        run: pip install twscrape

      - name: Collect tweets
        run: python script/twitter_twscrape.py
        env:
          TW_AUTH_TOKEN: ${{ secrets.TW_AUTH_TOKEN }}
          TW_CT0: ${{ secrets.TW_CT0 }}
          TW_BATCH: '8'

      - name: Commit tweets.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/twitter/tweets.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "twitter: collect via twscrape $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push
