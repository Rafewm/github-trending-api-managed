name: Collect Twitter (twscrape)

on:
  workflow_dispatch:
  schedule:
    # Hourly, offset from the trending run (GitHub often starts it hours late). Each run does TW_BATCH accounts
    # (oldest first) and reads each back to where its last visit stopped.
    - cron: '17 * * * *'

concurrency:
  group: twitter-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install twscrape
        run: pip install twscrape

      # Capped so a run stalled by X's limits can't reach GitHub's 6-hour cancel. The script saves after every account,
      # and the commit below runs even when this step times out, so what was read is kept.
      - name: Collect tweets
        timeout-minutes: 50
        run: python script/twitter_twscrape.py
        env:
          TW_AUTH_TOKEN: ${{ secrets.TW_AUTH_TOKEN }}
          TW_CT0: ${{ secrets.TW_CT0 }}
          TW_BATCH: '24'
          # When X refuses the account (it answered HTTP 403 to every request from Nov 26 on), twscrape locks it for
          # 15 minutes and waits; raising instead ends a blocked run in a minute and still saves what was read.
          TWS_RAISE_WHEN_NO_ACCOUNT: 'true'
          # Without this Python holds the script's own lines until exit, so a cut-off run logs nothing of its progress.
          PYTHONUNBUFFERED: '1'

      - name: Commit tweets.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/twitter/tweets.json data/twitter/account_ids.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "twitter: collect via twscrape $(date -u +%FT%TZ)"
          git pull --rebase origin main
          git push
